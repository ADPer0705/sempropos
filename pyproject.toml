[project]
name = "sempropos"
version = "0.1.0"
description = "Offline CLI command synthesis from local man pages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"rank-bm25>=0.2.2",
	"fastembed>=0.3.0",
	"numpy>=1.26",
	"tqdm>=4.0",
	"requests>=2.31",
	"psutil>=5.9",
	"keyring>=25.7.0",
	"platformdirs>=4.9.6",
	"tomli-w>=1.2.0",
	"typer>=0.25.1",
	"questionary>=2.1.1",
	"pip>=26.1.1",
]

[project.optional-dependencies]
dev = [
	"ruff>=0.6",
	"build>=1.2.0",
	"twine>=5.1.1",
]

[project.scripts]
sempropos = "sempropos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sempropos*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
