[project]
name = "sempropos"
version = "0.1.0"
description = "Offline CLI command synthesis from local man pages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"rank-bm25>=0.2.2",
	"fastembed>=0.3.0",
	"numpy>=1.26",
	"tqdm>=4.0",
	"requests>=2.31",
	"huggingface-hub>=0.20.0",
	"psutil>=5.9",
	"tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"pytest-cov>=5.0",
	"ruff>=0.6",
	"build>=1.2.0",
	"twine>=5.1.1",
]

[project.scripts]
sempropos = "sempropos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sempropos*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
	"live_network: opt-in tests that require live network/API access",
]
