name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      # The full test suite is being rebuilt; until then CI verifies that every
      # module imports cleanly so packaging regressions are caught early.
      - name: Import smoke check
        run: |
          uv run --python ${{ matrix.python-version }} python -c "
          import sempropos
          import sempropos.cli
          import sempropos.config
          import sempropos.index
          import sempropos.retrieval
          import sempropos.sources
          print('sempropos', sempropos.__version__, 'imports OK')
          "

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
