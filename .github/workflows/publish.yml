name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest
    
    # PyPI requires OpenID Connect (OIDC) through environments.
    # Create the 'pypi' environment in Settings -> Environments 
    # for the Trusted Publisher OIDC flow to work.
    environment:
      name: pypi
      url: https://pypi.org/p/sempropos

    permissions:
      id-token: write 
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🛠️ Install build tools
        run: python -m pip install --upgrade build

      - name: 📦 Build a binary wheel and a source tarball
        run: python -m build

      - name: 🚀 Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
